# Outbound edge: the ONLY way out of the internal network (SEC-EGR-2).
# Anything not listed in allowlist.txt is refused. HTTPS is tunnelled
# (CONNECT) without being decrypted.
http_port 3128
acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all
# Log destination host and result only (no URLs or bodies) for egress audits.
logformat egress %ts.%03tu %>a %rm %ru %>Hs
access_log /var/log/squid/access.log egress
cache deny all
via off
forwarded_for delete
pinger_enable off
