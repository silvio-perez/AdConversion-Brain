# Local development stack: Forgejo (Git server) + Postgres.
# LOCAL ONLY: ports bind to 127.0.0.1. Production config comes in Milestone 6.
name: brain-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm stack:init first}
      POSTGRES_DB: forgejo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d forgejo"]
      interval: 2s
      timeout: 3s
      retries: 30

  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - forgejo-data:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: brain
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?run pnpm stack:init first}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN:?run pnpm stack:init first}
      # SEC-AUTH-1: no self-service sign-up; accounts are provisioned.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      # SEC-ISO-2: deny by default. Nothing is visible without signing in,
      # and every repository is private.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_ORG_VISIBILITY: private
      FORGEJO__service__DEFAULT_USER_VISIBILITY: private
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__FORCE_PRIVATE: "true"
      # SEC-EGR-4: no phoning home. Disable the update checker, external
      # avatars (Gravatar) and CDN assets; Forgejo has no telemetry itself.
      FORGEJO__cron_0X2E_update_checker__ENABLED: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__picture__DISABLE_GRAVATAR: "true"
      FORGEJO__picture__ENABLE_FEDERATED_AVATAR: "false"
      FORGEJO__federation__ENABLED: "false"
      # Not needed: fewer features, smaller attack surface.
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__mailer__ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  db-data:
  forgejo-data:
