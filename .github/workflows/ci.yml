name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: License policy (SEC-SUP-1)
        run: pnpm check:licenses
      - name: Vulnerability audit (SEC-SUP-2)
        run: pnpm check:audit

  isolation:
    # Boots the real stack (Forgejo + Postgres), seeds synthetic data and proves
    # client isolation and change control on every push (SEC-ISO-4, SEC-INT-1).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stack:init
      - run: pnpm stack:up
      - run: pnpm stack:seed
      - name: Start gateway
        run: |
          pnpm gateway > gateway.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8787/healthz && exit 0; sleep 1; done
          cat gateway.log; exit 1
      - name: Isolation and change-control tests
        run: pnpm test:stack
      - name: Stack logs on failure
        if: failure()
        run: |
          cat gateway.log || true
          pnpm stack:logs --tail 200
